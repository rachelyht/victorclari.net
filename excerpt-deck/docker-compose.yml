services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    ports:
      - '8787:8787'
    volumes:
      - worker-jobs:/tmp/excerpt-deck-jobs

  web:
    image: python:3.12-slim-bookworm
    working_dir: /web
    command: python3 -m http.server 8080
    ports:
      - '8080:8080'
    volumes:
      - ./web:/web:ro

volumes:
  worker-jobs:
